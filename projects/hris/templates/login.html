<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register | HRIS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #f0f2f5; 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
        }
        .auth-container { 
            min-height: 100vh; 
            width: 100%;
        }
        .auth-card { 
            max-width: 450px; 
            width: 100%;
        }
        .form-section { 
            display: none;
        }
        .form-section.active { 
            display: block; 
        }
        .brand-icon-lg {
            font-size: 2.5rem;
            color: #1e3a5f;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="card auth-card border-0 shadow-sm mx-auto">
            <div class="card-body p-4 p-md-5">
                <!-- Header -->
                <div class="text-center mb-4">
                    <img src="/static/img/logo.png?v=2" alt="PT Mitsindo Logo" class="mb-3" style="width: 80px; height: 80px; object-fit: contain;">
                    <h4 class="fw-bold mb-1" style="color: #1e3a5f;">HRIS System</h4>
                    <p class="text-muted mb-0">PT Mitsindo</p>
                </div>

                <!-- Alert Box -->
                <div id="authAlert" class="alert d-none" role="alert"></div>

                <!-- LOGIN FORM -->
                <div id="loginSection" class="form-section active">
                    <h5 class="mb-3 text-center">Masuk ke Akun Anda</h5>
                    <form id="loginForm" method="POST" action="/api/auth/login" onsubmit="return App.handleLogin(event)">
                        <div class="mb-3">
                            <label for="username" class="form-label">Username or Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                <input type="text" class="form-control border-start-0 bg-light" id="username" name="username" placeholder="Enter your username" autocomplete="username" required autofocus>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 bg-light" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
                                <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePassword()">
                                    <i class="fas fa-eye" id="passwordToggle"></i>
                                </button>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" name="remember" checked>
                                <label class="form-check-label text-muted" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="text-decoration-none small" style="color: #2c5282;">Forgot password?</a>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2" id="loginBtn">
                            <span class="btn-text">Sign In</span>
                            <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                        </button>
                    </form>

                    <div class="text-center mt-4">
                        <small class="text-muted">Don't have an account? 
                            <a href="#" onclick="showRegister()" class="text-decoration-none fw-medium" style="color: #2c5282;">Register now</a>
                        </small>
                    </div>
                </div>

                <!-- REGISTER FORM -->
                <div id="registerSection" class="form-section">
                    <h5 class="mb-3 text-center">Buat Akun Baru</h5>
                    <form id="registerForm" onsubmit="return App.handleRegister(event)">
                        <div class="row g-2 mb-3">
                            <div class="col-md-6">
                                <label for="reg_fullname" class="form-label">Full Name</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 bg-light" id="reg_fullname" name="full_name" required>
                                </div>
                            </div>
                            <div class="col-md-6">
                                <label for="reg_username" class="form-label">Username</label>
                                <div class="input-group input-group-sm">
                                    <span class="input-group-text bg-light border-end-0"><i class="fas fa-at text-muted"></i></span>
                                    <input type="text" class="form-control border-start-0 bg-light" id="reg_username" name="username" required>
                                </div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="reg_email" class="form-label">Email</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                <input type="email" class="form-control border-start-0 bg-light" id="reg_email" name="email" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="reg_phone" class="form-label">Phone Number</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-phone text-muted"></i></span>
                                <input type="tel" class="form-control border-start-0 bg-light" id="reg_phone" name="phone" required>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label for="reg_department" class="form-label">Department</label>
                            <select class="form-select form-select-sm" id="reg_department" name="department">
                                <option value="">Select Department</option>
                                <option value="Human Resources">Human Resources</option>
                                <option value="Engineering">Engineering</option>
                                <option value="Marketing">Marketing</option>
                                <option value="Finance">Finance</option>
                                <option value="Operations">Operations</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="reg_position" class="form-label">Position</label>
                            <input type="text" class="form-control form-control-sm" id="reg_position" name="position" placeholder="e.g., Staff, Manager">
                        </div>
                        <div class="mb-4">
                            <label for="reg_password" class="form-label">Password</label>
                            <div class="input-group input-group-sm">
                                <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                <input type="password" class="form-control border-start-0 bg-light" id="reg_password" name="password" required minlength="6">
                                <button class="btn btn-outline-secondary border-start-0" type="button" onclick="togglePasswordReg()">
                                    <i class="fas fa-eye" id="passwordToggleReg"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 py-2" id="regBtn">
                            <span class="btn-text">Create Account</span>
                            <span class="spinner-border spinner-border-sm d-none ms-2" role="status"></span>
                        </button>
                    </form>
                    <div class="text-center mt-4">
                        <small class="text-muted">Already have an account? 
                            <a href="#" onclick="showLogin()" class="text-decoration-none fw-medium" style="color: #2c5282;">Sign in</a>
                        </small>
                    </div>
                </div>

                <!-- Footer -->
                <div class="text-center mt-4">
                    <small class="text-muted">&copy; 2026 PT Mitsindo. All rights reserved.</small>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/app.js?v=20260919_v8"></script>
    <script>
        function togglePassword() {
            const pwd = document.getElementById('password');
            const icon = document.getElementById('passwordToggle');
            if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { pwd.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        function togglePasswordReg() {
            const pwd = document.getElementById('reg_password');
            const icon = document.getElementById('passwordToggleReg');
            if (pwd.type === 'password') { pwd.type = 'text'; icon.classList.replace('fa-eye', 'fa-eye-slash'); }
            else { pwd.type = 'password'; icon.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        function showRegister() {
            document.getElementById('loginSection').classList.remove('active');
            document.getElementById('registerSection').classList.add('active');
            document.getElementById('reg_username').focus();
        }

        function showLogin() {
            document.getElementById('registerSection').classList.remove('active');
            document.getElementById('loginSection').classList.add('active');
            document.getElementById('username').focus();
        }

        function fillDemo(username, password) {
            showLogin();
            const userInput = document.getElementById('username');
            const passInput = document.getElementById('password');
            if (userInput) userInput.value = username;
            if (passInput) passInput.value = password;
            if (userInput) userInput.focus();
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('authAlert');
            alertBox.className = `alert alert-${type}`;
            alertBox.textContent = message;
            alertBox.classList.remove('d-none');
            setTimeout(() => alertBox.classList.add('d-none'), 5000);
        }
    </script>
</body>
</html>
